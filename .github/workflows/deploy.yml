name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build for project Pages
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      - name: Include uploaded opening background images
        run: cp gold_light.png floral_wedding.png sakura_tunnel.png balloon_party.png starry_story.png retro_cinema.png dist/
      - name: Include transparent frame assets
        run: mkdir -p dist/frames && cp frames/*.svg dist/frames/
      - name: Include original uploaded transparent PNG frames
        run: cp album.png balloon.png film.png film_simple.png fine_gold.png fine_silver.png gold.png green.png hand_blue.png hand_pink.png photo_corner.png polaroid.png rainbow.png sakura.png simple_beige.png simple_black.png simple_gray.png simple_white.png snow.png soft.png sunflower.png theater.png washi.png watercolor.png dist/
      - name: Include album artwork when uploaded
        run: for f in AB7615CA-AEB7-4DD6-9C97-061B612CF4ED.png 5D7629A6-7CD4-4630-9F0B-41ED75881354.png; do if [ -f "$f" ]; then cp "$f" dist/; fi; done
      - name: Include home artwork
        run: for f in home_header.jpg home_hero.jpg home_create.jpg home_footer.jpg; do if [ -f "$f" ]; then cp "$f" dist/; fi; done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
